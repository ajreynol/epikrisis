name: anoieu

on: [push, pull_request]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the policy, at the commit this repository pins
        # The pin is `anoieu.lock`, moved by koine's `eo_bump` and never by
        # hand. That file also records why the pin and the checker path below
        # move together: the checker moved from tools/ to scripts/ in anoieu
        # after the commit this repository used to pin.
        run: |
          git clone --quiet https://github.com/ajreynol/anoieu /tmp/anoieu
          git -C /tmp/anoieu checkout --quiet "$(grep -v '^#' anoieu.lock | head -1)"
      - name: run it against this tree
        # Look in both rather than naming one: a bump that lands on a tree with
        # neither then fails saying so, which is the failure to want. Naming one
        # path would fail with a bare "No such file or directory" and read as a
        # broken runner.
        run: |
          set -eu
          for candidate in scripts/policy_check.py tools/policy_check.py; do
            if [ -f "/tmp/anoieu/${candidate}" ]; then
              echo "checker: ${candidate}"
              exec python3 "/tmp/anoieu/${candidate}" --root .
            fi
          done
          echo "error: no policy_check.py in the anoieu commit anoieu.lock names." >&2
          echo "Looked in scripts/ and tools/. If it moved again, add the" >&2
          echo "new path to the list in this workflow." >&2
          exit 1
