name: anoieu

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # The checker is anoieu's, and so is the workflow that runs it: it checks out
  # this tree and current anoieu side by side, so a fix to the implementation
  # reaches this build without a commit here. What this repository chooses is
  # the contract. Version 1 fixes which requirements apply and which of them
  # block, so a new obligation cannot arrive without a new version being named
  # on the line below.
  policy:
    uses: ajreynol/anoieu/.github/workflows/policy.yml@main
    with:
      policy-version: '1'
